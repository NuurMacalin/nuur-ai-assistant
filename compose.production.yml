name: nuur-ai

x-app: &app
  image: nuur-ai:local
  build: .
  env_file: app/.env
  environment:
    QDRANT_URL: http://vector-db:6333
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    - vector-db

services:
  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  vector-db:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

  indexer:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "app.index"]
    volumes:
      - ./app/data:/srv/nuur-ai/app/data:ro

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  qdrant_data:
  caddy_data:
  caddy_config:
